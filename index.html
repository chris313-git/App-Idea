<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Finn Mode"><link rel="manifest" href="manifest.json"><title>Finn Mode</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}.app{max-width:720px;margin:auto;padding:20px 15px 90px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:15px}h1{margin:0;font-size:30px}.muted{color:#999}.card{background:#16161b;border:1px solid #29292f;border-radius:18px;padding:16px;margin:10px 0}.hero{background:linear-gradient(135deg,#1c1c22,#101014)}.eyebrow{font-size:11px;letter-spacing:1px;color:#999;text-transform:uppercase}.title{font-size:22px;font-weight:800;margin:5px 0}.pill{background:#24242a;border-radius:99px;padding:6px 9px;font-size:11px;color:#bbb}.exercise{padding:14px 0;border-top:1px solid #29292f}.exercise:first-child{border-top:0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.inputs{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;margin-top:8px}.inputs input,.field input{width:100%;padding:10px;background:#0c0c0f;color:white;border:1px solid #303037;border-radius:9px}.inputs label,.field label{font-size:10px;color:#999}.btn{border:0;border-radius:11px;padding:11px 13px;background:#25252b;color:white}.primary{width:100%;background:#f5f5f5;color:#080808;font-weight:800}.complete{width:100%;margin-top:8px}.done{background:#28432b;color:#9be59c}.section{font-size:17px;font-weight:800;margin:18px 0 8px}nav{position:fixed;bottom:0;left:0;right:0;z-index:5;background:#0b0b0ddd;border-top:1px solid #29292f;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px env(safe-area-inset-bottom)}nav button{background:none;color:#888;border:0;padding:8px 2px;font-size:11px}nav button.active{color:white;background:#222229;border-radius:9px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{background:#222229;padding:12px;border-radius:12px}.stat b{display:block;font-size:21px;margin-top:3px}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:end}.sheet{background:#16161b;width:100%;max-height:90vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px}.hidden{display:none}.tip{font-size:12px;color:#aaa;line-height:1.5}
</style></head><body><div class="app"><header><div><h1>FINN MODE</h1><div class="muted">12-WEEK ATHLETIC CUT</div></div><span class="pill" id="week"></span></header><main id="view"></main></div><nav><button data-tab="today">TODAY</button><button data-tab="run">RUN</button><button data-tab="body">BODY</button><button data-tab="food">FOOD</button><button data-tab="program">PROGRAM</button></nav><div id="modal" class="modal hidden"></div><script>
const KEY="finnModeV1";const S=JSON.parse(localStorage.getItem(KEY)||"null")||{week:1,logs:{},body:[],custom:{}};const save=()=>localStorage.setItem(KEY,JSON.stringify(S));
const E=(name,sets,reps,rpe,type="strength",note="")=>({name,sets,reps,rpe,type,note});
const W={mon:{name:"Upper Power + Easy Mile",warm:["2 min easy row/bike","Scapular push-ups x10","Band pull-aparts x15","Wall slides x10","90/90 hip switches x6/side","Med-ball chest pass x3","Bench warm-up sets"],ex:[E("Plyometric push-up",3,"4–6",6,"power","Explosive; stop when speed drops"),E("Barbell bench press",4,"5–6","7.5–8.5"),E("Weighted pull-up",4,"5–8",8),E("Half-kneeling landmine press",3,"8/side",8),E("Chest-supported row",3,"8–10","8–9"),E("Hanging leg raise",3,"10–15","8–9","core","Posterior pelvic tilt; no swinging")],run:"1 mile easy, RPE 5–6"},tue:{name:"Lower Strength + Athleticism",warm:["2 min bike","Ankle rocks x10/side","Walking world's-greatest-stretch x5/side","Adductor rockbacks x8/side","Bodyweight Cossack squat x5/side","Glute bridge x10","Pogo hops x20","Squat warm-up sets"],ex:[E("Box jump",4,3,6,"power","Stick landing; step down"),E("Back squat",4,5,8),E("Romanian deadlift",3,"6–8",8),E("Bulgarian split squat",3,"8/leg",8),E("Nordic hamstring curl",3,"5–8",8,"strength","Assistance allowed"),E("Ab wheel rollout",3,"8–12","8–9","core","Ribs down; controlled")]},thu:{name:"Upper Athletic + Intervals",warm:["2 min jump rope/bike","Band external rotation x12","Banded lat pulldown x12","Thoracic rotations x6/side","Bear crawl x10 yd","Rotational med-ball throw x3/side","Light push press x5"],ex:[E("Medicine-ball rotational scoop toss",4,"4/side",6,"power","Max intent; full reset"),E("Push press",4,4,"7.5–8"),E("One-arm dumbbell row",4,"8/side",8),E("Incline dumbbell press",3,"8–10","8–9"),E("Cable lateral raise",3,"12–15",9,"hypertrophy"),E("Kneeling cable crunch",3,"10–15",9,"core","Curl the spine")],run:"W1–4: 6x200m hard/200m easy; W5–8: 6x300m hard/200m easy; W9–11: 5x400m ~5K pace; W12: 4x200m fast/relaxed"},fri:{name:"Lower Power + Posterior Chain",warm:["2 min incline treadmill","Lateral lunges x6/side","90/90 switches x6/side","Single-leg glute bridge x8/side","Tibialis raises x15","Pogo hops x20","Broad-jump practice x3","Deadlift warm-up sets"],ex:[E("Broad jump",4,3,6,"power","Stick landing; reset"),E("Trap-bar deadlift",4,"4–5",8),E("Front squat",3,6,8),E("Single-leg RDL",3,"8/side",8),E("Loaded Cossack squat",3,"6–8/side",8),E("Copenhagen plank",3,"20–30 sec/side",8,"core","Start short-lever if needed")]},sat:{name:"Easy / Steady Run",warm:["5 min brisk walk/easy jog","Ankle rocks x10/side","Leg swings x10/side","A-skips x2x15 yd","2 relaxed strides"],ex:[],run:"W1–4: 2–3 km easy; W5–8: 3–4 km; W9–11: 4–5 km; W12: 3 km easy or controlled 5K"}};
const days=["mon","tue","wed","thu","fri","sat","sun"],names={mon:"MONDAY",tue:"TUESDAY",wed:"WEDNESDAY",thu:"THURSDAY",fri:"FRIDAY",sat:"SATURDAY",sun:"SUNDAY"};const today=()=>["sun","mon","tue","wed","thu","fri","sat"][new Date().getDay()];const wk=k=>S.custom[k]||W[k];const lk=(k,i)=>S.week+"-"+k+"-"+i;
function renderToday(){let k=today();if(k==="wed"||k==="sun")return '<section class="card hero"><div class="eyebrow">NON-NEGOTIABLE REST</div><div class="title">'+names[k]+' — REST</div><p class="muted">No scheduled lifting. No scheduled running. Recover, eat, hydrate, sleep.</p></section>';let w=wk(k),h='<section class="card hero"><div class="eyebrow">'+names[k]+' • WEEK '+S.week+'</div><div class="title">'+w.name+'</div><p class="muted">'+(w.run||"60-minute maximum lifting session")+'</p></section><section class="card"><div class="section">Warm-up</div>'+w.warm.map(x=>'<div class="tip">• '+x+'</div>').join("")+'</section>';if(w.ex.length){h+='<section class="card"><div class="section">Workout</div>';w.ex.forEach((e,i)=>{let l=S.logs[lk(k,i)]||{};h+='<div class="exercise"><div class="row"><b>'+String(i+1)+'. '+e.name+'</b><span class="pill">'+e.type+'</span></div><div class="tip">'+e.sets+' x '+e.reps+' • target RPE '+e.rpe+'<br>'+e.note+'</div><div class="inputs"><label>LOAD<input data-i="'+i+'" data-f="load" value="'+(l.load||"")+'"></label><label>REPS<input data-i="'+i+'" data-f="reps" value="'+(l.reps||"")+'"></label><label>RPE<input data-i="'+i+'" data-f="rpe" value="'+(l.rpe||"")+'"></label></div><button class="btn complete '+(l.done?"done":"")+'" data-done="'+i+'">'+(l.done?"✓ COMPLETED":"MARK COMPLETE")+'</button></div>'});h+='</section>'}return h+'<button class="btn primary" onclick="editDay(\''+k+'\')">MODIFY TODAY</button>'}
function renderRun(){return '<section class="card hero"><div class="eyebrow">RUNNING</div><div class="title">Build conditioning without becoming a distance runner.</div><p class="muted">Maximum programmed distance: 5 km. Wednesday and Sunday stay off.</p></section><section class="card"><div class="section">Weekly running</div><p><b>Monday:</b> 1 mile easy, RPE 5–6.</p><p><b>Thursday:</b> '+W.thu.run+'</p><p><b>Saturday:</b> '+W.sat.run+'</p><button class="btn primary" onclick="startTimer()">START 30-SECOND INTERVAL TIMER</button><div id="timer" style="font-size:42px;font-weight:800;text-align:center;padding:20px">00:30</div><button class="btn" onclick="resetTimer()">RESET</button></section>'}
function renderBody(){let n=Math.min(7,S.body.length),avg=n?S.body.slice(-n).reduce((a,x)=>a+x.weight,0)/n:215;return '<section class="card hero"><div class="eyebrow">BODY</div><div class="title">'+avg.toFixed(1)+' lb</div><p class="muted">Goal: 195 lb • 7-day average</p></section><section class="card"><div class="field"><label>WEIGHT</label><input id="bw" type="number" step=".1" placeholder="215"></div><div class="field" style="margin-top:8px"><label>WAIST @ NAVEL</label><input id="waist" type="number" step=".1"></div><button class="btn primary" style="margin-top:10px" onclick="saveBody()">SAVE</button></section>'}
function renderFood(){return '<section class="card hero"><div class="eyebrow">NUTRITION</div><div class="title">~2,400 kcal</div><p class="muted">Protein 200 g • Carbs 260–280 g • Fat 55–65 g • Fiber 35–45+ g</p></section><section class="card"><div class="section">Fasting-friendly structure</div><p>Fast → protein/fiber snack → train → protein/carbohydrate snack → large dinner.</p></section><section class="card"><div class="section">Affordable protein rotation</div><p>Greek yogurt • whey • egg whites • canned tuna • canned chicken • edamame • lentils • beans • soy milk • cottage cheese • protein bars • chia</p></section>'}
function renderProgram(){let h='<section class="card hero"><div class="eyebrow">PROGRAM</div><div class="title">Week '+S.week+' / 12</div><p class="muted">Explosive → heavy power → hypertrophy/core. RPE based.</p><div class="row"><button class="btn" onclick="changeWeek(-1)">←</button><span class="pill">WEEK '+S.week+'</span><button class="btn" onclick="changeWeek(1)">→</button></div></section>';days.forEach(k=>{if(k==="wed"||k==="sun")h+='<section class="card"><div class="row"><b>'+names[k]+'</b><span class="pill">REST</span></div></section>';else h+='<section class="card"><div class="row"><div><b>'+names[k]+'</b><div class="muted">'+wk(k).name+'</div></div><button class="btn" onclick="editDay(\''+k+'\')">EDIT</button></div></section>'});return h}
function editDay(k){let w=JSON.parse(JSON.stringify(wk(k))),h='<div class="sheet"><div class="row"><h2>Edit '+names[k]+'</h2><button class="btn" onclick="closeModal()">Close</button></div>';w.ex.forEach((e,i)=>h+='<div class="card"><b>'+e.name+'</b><div class="inputs"><label>SETS<input id="s'+i+'" value="'+e.sets+'"></label><label>REPS<input id="r'+i+'" value="'+e.reps+'"></label><label>RPE<input id="p'+i+'" value="'+e.rpe+'"></label></div><div class="field" style="margin-top:8px"><label>EXERCISE</label><input id="n'+i+'" value="'+e.name+'"></div></div>');h+='<button class="btn primary" onclick="saveEdit(\''+k+'\','+w.ex.length+')">SAVE CHANGES</button></div>';document.getElementById("modal").innerHTML=h;document.getElementById("modal").classList.remove("hidden")}
function saveEdit(k,n){let w=JSON.parse(JSON.stringify(wk(k)));for(let i=0;i<n;i++){w.ex[i].name=document.getElementById("n"+i).value;w.ex[i].sets=document.getElementById("s"+i).value;w.ex[i].reps=document.getElementById("r"+i).value;w.ex[i].rpe=document.getElementById("p"+i).value}S.custom[k]=w;save();closeModal();render()}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
function changeWeek(n){S.week=Math.max(1,Math.min(12,S.week+n));save();render()}
function saveBody(){let w=parseFloat(document.getElementById("bw").value);if(!w)return;S.body.push({date:new Date().toISOString(),weight:w,waist:parseFloat(document.getElementById("waist").value)||null});save();render()}
let timer=30,handle=null;function startTimer(){clearInterval(handle);timer=30;handle=setInterval(()=>{timer--;let x=document.getElementById("timer");if(x)x.textContent="00:"+String(Math.max(0,timer)).padStart(2,"0");if(timer<=0)clearInterval(handle)},1000)}function resetTimer(){clearInterval(handle);timer=30;let x=document.getElementById("timer");if(x)x.textContent="00:30"}
function tab(t){location.hash=t;render()}function render(){document.getElementById("week").textContent="WEEK "+S.week;let t=location.hash.slice(1)||"today";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.getElementById("view").innerHTML=t==="today"?renderToday():t==="run"?renderRun():t==="body"?renderBody():t==="food"?renderFood():renderProgram();document.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{let k=today(),key=lk(k,x.dataset.i);S.logs[key]=S.logs[key]||{};S.logs[key][x.dataset.f]=x.value;save()});document.querySelectorAll("[data-done]").forEach(x=>x.onclick=()=>{let key=lk(today(),x.dataset.done);S.logs[key]=S.logs[key]||{};S.logs[key].done=!S.logs[key].done;save();render()})}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>tab(b.dataset.tab));window.addEventListener("hashchange",render);render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
