function imgToData3(file){
  return new Promise((resolve,reject)=>{
    if(!file||!file.type.startsWith("image/"))return reject(new Error("Please choose an image."));
    const r=new FileReader();
    r.onerror=()=>reject(new Error("Could not read image."));
    r.onload=()=>{
      const im=new Image();
      im.onload=()=>{
        const max=1100,scale=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
        const w=Math.max(1,Math.round(im.naturalWidth*scale)),h=Math.max(1,Math.round(im.naturalHeight*scale));
        const can=document.createElement("canvas");can.width=w;can.height=h;const ctx=can.getContext("2d");
        ctx.drawImage(im,0,0,w,h);resolve(can.toDataURL("image/jpeg",.72));
      };
      im.onerror=()=>reject(new Error("Could not decode image."));im.src=r.result;
    };r.readAsDataURL(file);
  });
}

  run3={...run3,active:true,paused:false,start:Date.now(),elapsed:0,watch:null,points:[],meters:0,accuracy:null,tick:null,lastPoint:null};beginWatch3();run3.tick=setInterval(()=>{if(run3.active&&!run3.paused){run3.elapsed=Math.floor((Date.now()-run3.start)/1000);updateRun3()}},500);updateRun3();toast3("GPS run started")}
function pauseRun3(){if(!run3.active||run3.paused)return;run3.elapsed=Math.floor((Date.now()-run3.start)/1000);run3.paused=true;if(run3.watch!==null)navigator.geolocation.clearWatch(run3.watch);run3.watch=null;toast3("Run paused");updateRun3()}
function finishRun3(){if(!run3.active)return;run3.elapsed=run3.paused?run3.elapsed:Math.floor((Date.now()-run3.start)/1000);if(run3.watch!==null)navigator.geolocation.clearWatch(run3.watch);clearInterval(run3.tick);const entry={id:Date.now(),date:localDateV3(),started:new Date(run3.start).toISOString(),seconds:run3.elapsed,distanceKm:run3.meters/1000,points:run3.points,mode:run3.mode};S.runs.push(entry);S.events.push({time:new Date().toISOString(),type:"run",data:{id:entry.id,date:entry.date,seconds:entry.seconds,distanceKm:entry.distanceKm,mode:entry.mode}});save3();run3={active:false,paused:false,start:0,elapsed:0,watch:null,points:[],meters:0,accuracy:null,tick:null,mode:run3.mode,lastPoint:null};toast3("Run saved to History");renderV3()}
function resetRun3(){if(run3.watch!==null)navigator.geolocation.clearWatch(run3.watch);clearInterval(run3.tick);run3={active:false,paused:false,start:0,elapsed:0,watch:null,points:[],meters:0,accuracy:null,tick:null,mode:"free",lastPoint:null};renderV3()}
function setRunMode3(m){if(run3.active){toast3("Finish or reset the current run first.");return}run3.mode=m;renderV3()}
function route3(){
  if(run3.points.length<2)return '<div class="empty">Start moving and your local GPS route will appear here.</div>';
  const pts=run3.points, minX=Math.min(...pts.map(p=>p.lon)),maxX=Math.max(...pts.map(p=>p.lon)),minY=Math.min(...pts.map(p=>p.lat)),maxY=Math.max(...pts.map(p=>p.lat)),dx=Math.max(maxX-minX,1e-7),dy=Math.max(maxY-minY,1e-7);
  const xy=p=>[12+(p.lon-minX)/dx*76,88-(p.lat-minY)/dy*76];
  const poly=pts.map(p=>xy(p).join(",")).join(" ");
  return '<svg viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="'+poly+'" fill="none" stroke="#d9689b" stroke-width="1.7" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>';
}
function updateRun3(){
  const t=document.getElementById("runTime3");if(!t)return;
  const elapsed=run3.active&&!run3.paused?Math.floor((Date.now()-run3.start)/1000):run3.elapsed;
  if(run3.active&&!run3.paused)run3.elapsed=elapsed;
  t.textContent=fmt3(elapsed);
  const d=document.getElementById("runDist3"),p=document.getElementById("runPace3"),a=document.getElementById("runAcc3"),s=document.getElementById("runStatus3"),route=document.getElementById("route3");
  if(d)d.textContent=(run3.meters/1000).toFixed(2)+" km";if(p)p.textContent=pace3();if(a)a.textContent=run3.accuracy?Math.round(run3.accuracy)+" m":"--";
  if(s){s.textContent=run3.active?(run3.paused?"PAUSED":"LIVE GPS"):"READY";s.className="runstatus "+(run3.active&&!run3.paused?"on":"")}
  if(route)route.innerHTML=route3();
  const main=document.getElementById("runMain3");if(main)main.textContent=run3.active?(run3.paused?"RESUME RUN":"PAUSE RUN"):"START RUN";
}
function renderRun3(){
  const mode=run3.mode, modeText=mode==="easy"?"Easy / aerobic":mode==="interval"?"Intervals / quality":"Free run";
  return '<section class="card hero"><div class="eyebrow">RUN MODE</div><div class="title">'+modeText+'</div><p class="muted">Elapsed time, GPS distance, live pace, accuracy and a local route trace. Keep FINN MODE open while running; a static PWA cannot promise native background GPS behavior.</p></section>'+
  '<section class="card"><div class="mode-row"><button class="btn '+(mode==="free"?"primary":"")+'" onclick="setRunMode3(\'free\')">FREE RUN</button><button class="btn '+(mode==="easy"?"primary":"")+'" onclick="setRunMode3(\'easy\')">EASY</button><button class="btn '+(mode==="interval"?"primary":"")+'" onclick="setRunMode3(\'interval\')">INTERVALS</button></div>'+
  '<div id="runStatus3" class="runstatus" style="margin-top:15px">READY</div><div id="runTime3" class="timer">00:00:00</div>'+
  '<div class="run-grid"><div class="run-metric"><div class="label">DISTANCE</div><div id="runDist3" class="value">0.00 km</div></div><div class="run-metric"><div class="label">PACE / KM</div><div id="runPace3" class="value">--:--</div></div><div class="run-metric"><div class="label">GPS ACCURACY</div><div id="runAcc3" class="value">--</div></div><div class="run-metric"><div class="label">GPS POINTS</div><div id="runPts3" class="value">'+run3.points.length+'</div></div></div>'+
  '<div id="route3" class="route" style="margin-top:11px">'+route3()+'</div><div class="run-controls"><button id="runMain3" class="btn primary" onclick="'+(run3.active?(run3.paused?"startRun3()":"pauseRun3()"):"startRun3()")+'">'+(run3.active?(run3.paused?"RESUME RUN":"PAUSE RUN"):"START RUN")+'</button><button class="btn" onclick="'+(run3.active?"finishRun3()":"resetRun3()")+'">'+(run3.active?"FINISH + SAVE":"RESET")+'</button></div>'+
  '</section><section class="card"><div class="section">Programmed running</div><div class="segment"><b>Monday</b><br>1 mile easy, RPE 5–6.</div><div class="segment"><b>Thursday</b><br>'+escV3(W.thu.run)+'</div><div class="segment"><b>Saturday</b><br>'+escV3(W.sat.run)+'</div></section>'+
  '<section class="card"><div class="section">Run history</div>'+(S.runs.length?S.runs.slice().reverse().slice(0,8).map(r=>'<div class="segment"><div class="row"><b>'+dateLabel3(r.date)+'</b><span class="pill">'+(r.mode||"run")+'</span></div><div class="muted">'+r.distanceKm.toFixed(2)+' km • '+fmt3(r.seconds)+'</div></div>').join(""):'<div class="empty-state">Your completed runs will appear here.</div>')+'</section>';
}

function renderHistory3(){
  const a=[];
  (S.body||[]).forEach(x=>a.push({t:x.date,h:'<span class="tag">BODY</span><br><b>'+Number(x.weight).toFixed(1)+' lb</b>'}));
  Object.values(S.food||{}).forEach(x=>a.push({t:x.date+"T23:59:00",h:'<span class="tag">FOOD</span><br><b>'+Number(x.cal||0).toLocaleString()+' kcal</b> • '+Number(x.pro||0)+'g protein • '+Number(x.carb||0)+'g carbs'}));
  (S.runs||[]).forEach(x=>a.push({t:x.started,h:'<span class="tag">RUN</span><br><b>'+x.distanceKm.toFixed(2)+' km</b> • '+fmt3(x.seconds)+' • '+(x.mode||"run")}));
  Object.keys(S.logs||{}).forEach(k=>{const l=S.logs[k];if(l?.done){const p=k.split("|");a.push({t:p[0]+"T12:00:00",h:'<span class="tag">WORKOUT</span><br><b>'+escV3(names[p[1]]||p[1])+'</b> • exercise #'+(Number(p[2])+1)+(l.load?' • '+escV3(l.load):"")})}});
  (S.events||[]).filter(e=>e.type==="day_rollover"||e.type==="day_start"||e.type==="photo").forEach(e=>a.push({t:e.time,h:'<span class="tag">'+e.type.replace("_"," ").toUpperCase()+'</span><br><b>'+dateLabel3((e.data?.date||e.time).slice(0,10))+'</b> • automatically recorded'}));
  a.sort((x,y)=>new Date(y.t)-new Date(x.t));
  return '<section class="card hero"><div class="eyebrow">FULL HISTORY</div><div class="title">Your training record, not just a log.</div><p class="muted">Workouts • nutrition • weight • runs • progress photos • automatic day rollovers.</p><div class="kpi-row"><div class="kpi"><b>'+S.body.length+'</b><span>WEIGH-INS</span></div><div class="kpi"><b>'+S.runs.length+'</b><span>RUNS</span></div><div class="kpi"><b>'+Object.keys(S.food).length+'</b><span>FOOD DAYS</span></div></div></section>'+
  '<section class="card"><div class="section">Timeline</div>'+(a.map(x=>'<div class="history-item"><div class="muted">'+new Date(x.t).toLocaleString()+'</div>'+x.h+'</div>').join("")||'<div class="empty-state">Nothing logged yet. Your history builds automatically as you use FINN MODE.</div>')+'</section>'+
  '<section class="card"><div class="section">Data safety</div><p class="tip">Your data is stored locally on this device. Export a backup regularly. Progress photos are compressed before storage, but device storage is still finite.</p><button class="btn" onclick="exportV3()">EXPORT FULL BACKUP</button></section>';
}
function exportV3(){const b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="finn-mode-backup-"+localDateV3()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast3("Backup exported")}

function renderProgram3(){
  let h='<section class="card hero"><div class="eyebrow">PROGRAM</div><div class="title">Week '+S.week+' / 12</div><p class="muted">Explosive work → strength → hypertrophy/core. RPE based. Wednesday and Sunday are fixed rest days.</p><div class="row"><button class="btn" onclick="changeWeek(-1)">←</button><span class="pill">WEEK '+S.week+'</span><button class="btn" onclick="changeWeek(1)">→</button></div></section>';
  days.forEach(k=>{if(k==="wed"||k==="sun")h+='<section class="card"><div class="row"><b>'+names[k]+'</b><span class="pill">REST</span></div></section>';else h+='<section class="card"><div class="row"><div><b>'+names[k]+'</b><div class="muted">'+escV3(wk(k).name)+'</div></div><button class="btn" onclick="editDay(\''+k+'\')">EDIT</button></div></section>'});
  return h+'<section class="card"><div class="section">Exercise library</div><p class="tip">Photo and video demonstrations for every programmed movement.</p><button class="btn primary" onclick="showLibraryV2()">OPEN FULL EXERCISE LIBRARY</button></section>';
}

function renderToday3(){
  let k=todayDay3();if(k==="wed"||k==="sun")return '<section class="card hero"><div class="eyebrow">NON-NEGOTIABLE REST</div><div class="title">'+names[k]+' — REST</div><p class="muted">Recover, eat, hydrate, sleep. The app will automatically record the new day when you return.</p></section>';
  let w=wk(k),h='<section class="card hero"><div class="eyebrow">'+names[k]+' • WEEK '+S.week+'</div><div class="title">'+escV3(w.name)+'</div><p class="muted">'+escV3(w.run||"60-minute maximum lifting session")+'</p></section><section class="card"><div class="section">Warm-up</div>'+w.warm.map(x=>'<div class="tip">• '+escV3(x)+'</div>').join("")+'</section>';
  if(w.ex.length){h+='<section class="card"><div class="section">Workout</div>';w.ex.forEach((e,i)=>{const l=S.logs[logKeyV2(localDateV3(),k,i)]||{};h+='<div class="exercise"><div class="row"><b>'+String(i+1)+'. '+escV3(e.name)+'</b><span class="pill">'+escV3(e.type)+'</span></div><div class="tip">'+escV3(e.sets)+' × '+escV3(e.reps)+' • target RPE '+escV3(e.rpe)+'<br>'+escV3(e.note)+'</div><div class="inputs"><label>LOAD<input data-i="'+i+'" data-f="load" value="'+escV3(l.load||"")+'"></label><label>REPS<input data-i="'+i+'" data-f="reps" value="'+escV3(l.reps||"")+'"></label><label>RPE<input data-i="'+i+'" data-f="rpe" value="'+escV3(l.rpe||"")+'"></label></div><button class="btn complete '+(l.done?"done":"")+'" data-done="'+i+'">'+(l.done?"✓ COMPLETED":"MARK COMPLETE")+'</button></div>'});h+='</section>'}
  return h+'<button class="btn primary" onclick="editDay(\''+k+'\')">MODIFY TODAY</button>';
}

function renderV3(){
  rollover3();
  document.getElementById("week").textContent="WEEK "+S.week;
  const t=location.hash.slice(1)||"today";
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));
  document.getElementById("view").innerHTML=t==="run"?renderRun3():t==="food"?renderFood3():t==="history"?renderHistory3():t==="body"?renderBody3():t==="program"?renderProgram3():renderToday3();
  if(t==="run"){updateRun3();const pts=document.getElementById("runPts3");if(pts)pts.textContent=run3.points.length}
  document.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{const key=logKeyV2(localDateV3(),todayDay3(),x.dataset.i);S.logs[key]=S.logs[key]||{};S.logs[key][x.dataset.f]=x.value;save3()});
  document.querySelectorAll("[data-done]").forEach(x=>x.onclick=()=>{const key=logKeyV2(localDateV3(),todayDay3(),x.dataset.done);S.logs[key]=S.logs[key]||{};S.logs[key].done=!S.logs[key].done;if(S.logs[key].done)S.events.push({time:new Date().toISOString(),type:"workout",data:{day:names[todayDay3()],exercise:Number(x.dataset.done)+1,date:localDateV3()}});save3();renderV3()});
}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab;renderV3()});
window.removeEventListener("hashchange",renderV2);
window.addEventListener("hashchange",renderV3);
renderV3();

if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
