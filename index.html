function renderToday(){let k=today();if(k==="wed"||k==="sun")return '<section class="card hero"><div class="eyebrow">NON-NEGOTIABLE REST</div><div class="title">'+names[k]+' — REST</div><p class="muted">No scheduled lifting. No scheduled running. Recover, eat, hydrate, sleep.</p></section>';let w=wk(k),h='<section class="card hero"><div class="eyebrow">'+names[k]+' • WEEK '+S.week+'</div><div class="title">'+w.name+'</div><p class="muted">'+(w.run||"60-minute maximum lifting session")+'</p></section><section class="card"><div class="section">Warm-up</div>'+w.warm.map(x=>'<div class="tip">• '+x+'</div>').join("")+'</section>';if(w.ex.length){h+='<section class="card"><div class="section">Workout</div>';w.ex.forEach((e,i)=>{let l=S.logs[lk(k,i)]||{};h+='<div class="exercise"><div class="row"><b>'+String(i+1)+'. '+e.name+'</b><span class="pill">'+e.type+'</span></div><div class="tip">'+e.sets+' x '+e.reps+' • target RPE '+e.rpe+'<br>'+e.note+'</div><div class="inputs"><label>LOAD<input data-i="'+i+'" data-f="load" value="'+(l.load||"")+'"></label><label>REPS<input data-i="'+i+'" data-f="reps" value="'+(l.reps||"")+'"></label><label>RPE<input data-i="'+i+'" data-f="rpe" value="'+(l.rpe||"")+'"></label></div><button class="btn complete '+(l.done?"done":"")+'" data-done="'+i+'">'+(l.done?"✓ COMPLETED":"MARK COMPLETE")+'</button></div>'});h+='</section>'}return h+'<button class="btn primary" onclick="editDay(\''+k+'\')">MODIFY TODAY</button>'}
function renderRun(){return '<section class="card hero"><div class="eyebrow">RUNNING</div><div class="title">Build conditioning without becoming a distance runner.</div><p class="muted">Maximum programmed distance: 5 km. Wednesday and Sunday stay off.</p></section><section class="card"><div class="section">Weekly running</div><p><b>Monday:</b> 1 mile easy, RPE 5–6.</p><p><b>Thursday:</b> '+W.thu.run+'</p><p><b>Saturday:</b> '+W.sat.run+'</p><button class="btn primary" onclick="startTimer()">START 30-SECOND INTERVAL TIMER</button><div id="timer" style="font-size:42px;font-weight:800;text-align:center;padding:20px">00:30</div><button class="btn" onclick="resetTimer()">RESET</button></section>'}

function renderProgram(){let h='<section class="card hero"><div class="eyebrow">PROGRAM</div><div class="title">Week '+S.week+' / 12</div><p class="muted">Explosive → heavy power → hypertrophy/core. RPE based.</p><div class="row"><button class="btn" onclick="changeWeek(-1)">←</button><span class="pill">WEEK '+S.week+'</span><button class="btn" onclick="changeWeek(1)">→</button></div></section>';days.forEach(k=>{if(k==="wed"||k==="sun")h+='<section class="card"><div class="row"><b>'+names[k]+'</b><span class="pill">REST</span></div></section>';else h+='<section class="card"><div class="row"><div><b>'+names[k]+'</b><div class="muted">'+wk(k).name+'</div></div><button class="btn" onclick="editDay(\''+k+'\')">EDIT</button></div></section>'});return h}
function editDay(k){let w=JSON.parse(JSON.stringify(wk(k))),h='<div class="sheet"><div class="row"><h2>Edit '+names[k]+'</h2><button class="btn" onclick="closeModal()">Close</button></div>';w.ex.forEach((e,i)=>h+='<div class="card"><b>'+e.name+'</b><div class="inputs"><label>SETS<input id="s'+i+'" value="'+e.sets+'"></label><label>REPS<input id="r'+i+'" value="'+e.reps+'"></label><label>RPE<input id="p'+i+'" value="'+e.rpe+'"></label></div><div class="field" style="margin-top:8px"><label>EXERCISE</label><input id="n'+i+'" value="'+e.name+'"></div></div>');h+='<button class="btn primary" onclick="saveEdit(\''+k+'\','+w.ex.length+')">SAVE CHANGES</button></div>';document.getElementById("modal").innerHTML=h;document.getElementById("modal").classList.remove("hidden")}
function saveEdit(k,n){let w=JSON.parse(JSON.stringify(wk(k)));for(let i=0;i<n;i++){w.ex[i].name=document.getElementById("n"+i).value;w.ex[i].sets=document.getElementById("s"+i).value;w.ex[i].reps=document.getElementById("r"+i).value;w.ex[i].rpe=document.getElementById("p"+i).value}S.custom[k]=w;save();closeModal();render()}

function tab(t){location.hash=t;render()}function render(){document.getElementById("week").textContent="WEEK "+S.week;let t=location.hash.slice(1)||"today";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.getElementById("view").innerHTML=t==="today"?renderToday():t==="run"?renderRun():t==="body"?renderBody():t==="food"?renderFood():renderProgram();document.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{let k=today(),key=lk(k,x.dataset.i);S.logs[key]=S.logs[key]||{};S.logs[key][x.dataset.f]=x.value;save()});document.querySelectorAll("[data-done]").forEach(x=>x.onclick=()=>{let key=lk(today(),x.dataset.done);S.logs[key]=S.logs[key]||{};S.logs[key].done=!S.logs[key].done;save();render()})}

let runV2={active:false,start:0,watch:null,points:[],meters:0,timer:null};
const havV2=(a,b)=>{const R=6371000,la=(a.lat-b.lat)*Math.PI/180,lo=(a.lon-b.lon)*Math.PI/180,x=Math.sin(la/2)**2+Math.cos(a.lat*Math.PI/180)*Math.cos(b.lat*Math.PI/180)*Math.sin(lo/2)**2;return 2*R*Math.asin(Math.sqrt(x))};

function saveFoodV2(){let x={date:dayISO(),cal:+(document.getElementById("fcal").value||0),pro:+(document.getElementById("fpro").value||0),carb:+(document.getElementById("fcarb").value||0),fat:+(document.getElementById("ffat").value||0),fiber:+(document.getElementById("ffiber").value||0),water:+(document.getElementById("fwater").value||0),note:document.getElementById("fnote").value};S.food[dayISO()]=x;recordV2("food",x);toastV2("Food day saved");render()}
function renderFoodV2(){let f=S.food[dayISO()]||{};return '<section class="card hero"><div class="eyebrow">FOOD LOG</div><div class="title">Track the whole day.</div><p class="muted">Daily nutrition history with a MyFitnessPal handoff.</p></section><section class="card"><div class="inputs"><label>CALORIES<input id="fcal" type="number" value="'+(f.cal||"")+'"></label><label>PROTEIN G<input id="fpro" type="number" value="'+(f.pro||"")+'"></label><label>CARBS G<input id="fcarb" type="number" value="'+(f.carb||"")+'"></label></div><div class="inputs" style="margin-top:9px"><label>FAT G<input id="ffat" type="number" value="'+(f.fat||"")+'"></label><label>FIBER G<input id="ffiber" type="number" value="'+(f.fiber||"")+'"></label><label>WATER OZ<input id="fwater" type="number" value="'+(f.water||"")+'"></label></div><div class="field" style="margin-top:9px"><label>NOTES</label><input id="fnote" value="'+(f.note||"")+'" placeholder="Meals / notes"></div><button class="btn primary" style="margin-top:10px" onclick="saveFoodV2()">SAVE TODAY</button></section><section class="card"><div class="section">Targets</div><p>~2,400 kcal • 200 g protein • 260–280 g carbs • 55–65 g fat • 35–45+ g fiber</p><a class="alink" href="https://www.myfitnesspal.com/" target="_blank" rel="noopener">OPEN MYFITNESSPAL ↗</a></section>'}
function renderHistoryV2(){let a=[];S.body.forEach(x=>a.push({t:x.date,h:'<span class="tag">BODY</span><br><b>'+Number(x.weight).toFixed(1)+' lb</b>'+(x.waist?' • waist '+x.waist+' in':'')}));Object.values(S.food).forEach(x=>a.push({t:x.date,h:'<span class="tag">FOOD</span><br><b>'+x.cal+' kcal</b> • '+x.pro+'g protein • '+x.carb+'g carbs • '+x.fat+'g fat'}));S.runs.forEach(x=>a.push({t:x.started,h:'<span class="tag">RUN</span><br><b>'+x.distanceKm.toFixed(2)+' km</b> • '+new Date(x.seconds*1000).toISOString().slice(11,19)}));Object.keys(S.logs).forEach(k=>{let l=S.logs[k];if(l.done){let p=k.split("|");a.push({t:p[0],h:'<span class="tag">WORKOUT</span><br><b>'+((names&&names[p[1]])||p[1])+'</b> • exercise #'+(Number(p[2])+1)+(l.load?' • '+l.load:"")})}});a.sort((x,y)=>new Date(y.t)-new Date(x.t));return '<section class="card hero"><div class="eyebrow">FULL HISTORY</div><div class="title">Everything in one timeline.</div><p class="muted">Workouts • food • weight • waist • runs • GPS summaries. Stored locally on this device.</p><div class="grid"><div class="stat"><span class="muted">WEIGH-INS</span><b>'+S.body.length+'</b></div><div class="stat"><span class="muted">RUNS</span><b>'+S.runs.length+'</b></div><div class="stat"><span class="muted">FOOD DAYS</span><b>'+Object.keys(S.food).length+'</b></div><div class="stat"><span class="muted">TIMELINE</span><b>'+a.length+'</b></div></div></section><section class="card"><div class="section">Timeline</div>'+(a.map(x=>'<div class="history-item"><div class="muted">'+new Date(x.t).toLocaleString()+'</div>'+x.h+'</div>').join("")||'<p class="muted">Nothing logged yet.</p>')+'</section><section class="card"><div class="section">Backup</div><button class="btn" onclick="exportV2()">EXPORT BACKUP</button></section>'}
function exportV2(){let b=new Blob([JSON.stringify(S,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="finn-mode-backup-"+dayISO()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function renderV2(){document.getElementById("week").textContent="WEEK "+S.week;let t=location.hash.slice(1)||"today";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));document.getElementById("view").innerHTML=t==="run"?renderRunV2():t==="food"?renderFoodV2():t==="history"?renderHistoryV2():t==="body"?renderBody():t==="program"?renderProgram():renderToday();if(t==="run")updateRunV2();document.querySelectorAll("[data-f]").forEach(x=>x.onchange=()=>{let key=logKeyV2(dayISO(),today(),x.dataset.i);S.logs[key]=S.logs[key]||{};S.logs[key][x.dataset.f]=x.value;saveV2()});document.querySelectorAll("[data-done]").forEach(x=>x.onclick=()=>{let key=logKeyV2(dayISO(),today(),x.dataset.done);S.logs[key]=S.logs[key]||{};S.logs[key].done=!S.logs[key].done;if(S.logs[key].done)recordV2("workout",{day:names[today()],exercise:+x.dataset.done+1});else saveV2();renderV2()})}
const oldRender=render;render=renderV2;
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{location.hash=b.dataset.tab;renderV2()});
window.addEventListener("hashchange",renderV2);
renderV2();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
